name: Build TrollStore IPA

on:
  workflow_dispatch:
    inputs:
      version:
        description: "应用版本号，例如 3.0.0"
        required: false
        default: "3.0.0"
        type: string
      build_number:
        description: "构建号，仅允许数字"
        required: false
        default: "30"
        type: string

permissions:
  contents: read

jobs:
  ipa:
    name: Build and sign for TrollStore
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Build logic lives in Zeu1s/trollstore-ipa so it stays useful outside this app.
      - name: Build IPA
        id: build
        uses: Zeu1s/trollstore-ipa@v1
        with:
          project: nodeseek.xcodeproj
          scheme: nodeseek
          version: ${{ inputs.version }}
          build-number: ${{ inputs.build_number }}
          ipa-name: NS-Connect-${{ inputs.version }}-trollstore-build${{ inputs.build_number }}.ipa
          artifact-name: trollstore-ipa

      - name: Summary
        run: |
          {
            echo "### TrollStore IPA"
            echo "- IPA: \`$IPA\`"
            echo "- App: \`$APP\`"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          IPA: ${{ steps.build.outputs.ipa-path }}
          APP: ${{ steps.build.outputs.app-path }}
