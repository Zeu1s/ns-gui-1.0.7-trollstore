name: Build IPA via trollstore-ipa action

on:
  workflow_dispatch:
    inputs:
      version:
        description: "MARKETING_VERSION"
        required: false
        default: "3.0.0"
        type: string
      build_number:
        description: "CURRENT_PROJECT_VERSION (digits only)"
        required: false
        default: "140"
        type: string

permissions:
  contents: read

jobs:
  ipa:
    name: Build TrollStore IPA with the shared action
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build
        id: build
        uses: Zeu1s/trollstore-ipa@v1
        with:
          project: nodeseek.xcodeproj
          scheme: nodeseek
          version: ${{ inputs.version }}
          build-number: ${{ inputs.build_number }}
          ipa-name: NS-Connect-${{ inputs.version }}-trollstore-build${{ inputs.build_number }}.ipa
          artifact-name: ns-connect-trollstore-ipa

      - name: Report
        run: |
          echo "IPA: ${{ steps.build.outputs.ipa-path }}"
          echo "App: ${{ steps.build.outputs.app-path }}"
